name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The nightly the engine formats with; keep it in step with the engine's `rust-toolchain.nightly`.
  FORMAT_TOOLCHAIN: nightly-2026-05-11
  # The engine release whose language tests run against the server. Keep it equal to the engine
  # version in `Cargo.toml`.
  ENGINE_REF: v4.0.0

jobs:
  format:
    name: Check format
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the formatting toolchain
        run: rustup toolchain install "${FORMAT_TOOLCHAIN}" --profile minimal --component rustfmt

      - name: Check format
        run: cargo "+${FORMAT_TOOLCHAIN}" fmt --all --check

  check:
    name: Clippy and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the build toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --workspace

  tikv:
    name: Backend and server against a TiKV cluster
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the build toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tikv-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build the server
        run: cargo build --locked --release -p surrealdb-tikv

      - name: Start a TiKV playground
        run: ci/tikv-playground.sh start

      - name: Backend tests against the cluster
        env:
          SURREAL_TIKV_TEST_ENDPOINT: 127.0.0.1:2379
        run: |
          cargo test --locked -p surrealdb-kvs-tikv --test kvs
          cargo test --locked -p surrealdb-kvs-tikv --test ops -- --ignored

      # The backend suites write keys with no version key, which the server refuses to start on.
      - name: Start a fresh TiKV playground for the server
        run: ci/tikv-playground.sh start

      - name: Start the server on TiKV
        run: |
          nohup target/release/surreal-tikv start --user root --pass root --bind 127.0.0.1:8000 tikv://127.0.0.1:2379 > /tmp/surreal.log 2>&1 &
          for _ in $(seq 1 30); do
            if target/release/surreal-tikv is-ready --endpoint http://127.0.0.1:8000; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::the server did not become ready"
          cat /tmp/surreal.log
          exit 1

      - name: Write and read back a record
        run: |
          cat > /tmp/smoke.surql <<'SQL'
          CREATE person:tobie SET name = 'Tobie';
          SELECT VALUE name FROM person:tobie;
          SQL
          out=$(target/release/surreal-tikv sql --endpoint http://127.0.0.1:8000 --user root --pass root --ns test --db test --hide-welcome < /tmp/smoke.surql)
          echo "${out}"
          echo "${out}" | grep -q "Tobie"

      - name: Server log
        if: failure()
        run: cat /tmp/surreal.log

      - name: Stop the playground
        if: always()
        run: ci/tikv-playground.sh stop

  language-tests:
    name: Language tests against a TiKV cluster
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the engine's language tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: surrealdb/surrealdb
          ref: ${{ env.ENGINE_REF }}
          path: engine
          sparse-checkout: |
            language-tests
            surrealdb

      - name: Install the build toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            engine/language-tests/target
          key: language-tests-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'engine/language-tests/Cargo.lock') }}

      - name: Build the server and the test runner
        run: |
          cargo build --locked --release -p surrealdb-tikv
          cargo build --release --manifest-path engine/language-tests/Cargo.toml --features remote

      - name: Start a TiKV playground
        run: ci/tikv-playground.sh start

      # The flags mirror the datastore the engine's own harness builds; see the remote-endpoint
      # section of the engine's language-tests README. Every capability is open because the tests
      # exercise them. The gRPC limits are raised
      # because the tests write records over the 4 MiB default.
      - name: Start the server on TiKV
        env:
          SURREAL_TIKV_GRPC_MAX_ENCODING_MESSAGE_SIZE: "134217728"
          SURREAL_TIKV_GRPC_MAX_DECODING_MESSAGE_SIZE: "134217728"
          SURREAL_FILE_ALLOWLIST: ${{ github.workspace }}/engine/language-tests/tests
        run: |
          mkdir -p /tmp/surreal-lt
          nohup target/release/surreal-tikv start --allow-all --allow-experimental '*' --temporary-directory /tmp/surreal-lt --no-defaults --user root --pass root --bind 127.0.0.1:8000 tikv://127.0.0.1:2379 > /tmp/surreal.log 2>&1 &
          for _ in $(seq 1 30); do
            if target/release/surreal-tikv is-ready --endpoint http://127.0.0.1:8000; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::the server did not become ready"
          cat /tmp/surreal.log
          exit 1

      # This test leaves a root-level default config that the runner cannot remove, and every
      # test after it is then reported as leaking root state. It fails the same way on an
      # in-memory server, so it is left out.
      # The morsel bench tests import 100000-record datasets, four at once, and the runner is shut
      # down while they run, so they are left out.
      - name: Run the language tests
        run: |
          rm engine/language-tests/tests/language/parameterized/schema/config.surql
          rm engine/language-tests/tests/language/morsel/bench_*.surql
          cd engine/language-tests
          set +e
          target/release/surrealql-test run --endpoint http://127.0.0.1:8000 --backend other --username root --password root --jobs 4 2>&1 | tee /tmp/language-tests.log
          set -e

      - name: Compare with the known failures
        run: python3 ci/check-language-tests.py /tmp/language-tests.log ci/language-tests-known-failures.txt

      - name: Server log
        if: failure()
        run: tail -n 500 /tmp/surreal.log

      - name: Stop the playground
        if: always()
        run: ci/tikv-playground.sh stop
