name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The nightly the engine formats with; keep it in step with the engine's `rust-toolchain.nightly`.
  FORMAT_TOOLCHAIN: nightly-2026-05-11

jobs:
  format:
    name: Check format
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the formatting toolchain
        run: rustup toolchain install "${FORMAT_TOOLCHAIN}" --profile minimal --component rustfmt

      - name: Check format
        run: cargo "+${FORMAT_TOOLCHAIN}" fmt --all --check

  check:
    name: Clippy and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the build toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --workspace

  tikv:
    name: Backend and server against a TiKV cluster
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the build toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tikv-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build the server
        run: cargo build --locked --release -p surrealdb-tikv

      - name: Start a TiKV playground
        run: |
          curl --proto '=https' --tlsv1.2 -sSf --connect-timeout 30 --max-time 120 https://tiup-mirrors.pingcap.com/install.sh | sh
          tiup="${HOME}/.tiup/bin/tiup"
          "${tiup}" install pd tikv playground
          nohup "${tiup}" playground --mode tikv-slim --kv 1 --pd 1 --db 0 --ticdc 0 --tiflash 0 --without-monitor --tag testing > /tmp/tiup.log 2>&1 &
          for _ in $(seq 1 12); do
            sleep 5
            if "${tiup}" playground display > /dev/null 2>&1; then
              exit 0
            fi
          done
          echo "::error::the TiKV playground did not start"
          cat /tmp/tiup.log
          exit 1

      - name: Backend tests against the cluster
        env:
          SURREAL_TIKV_TEST_ENDPOINT: 127.0.0.1:2379
        run: |
          cargo test --locked -p surrealdb-kvs-tikv --test kvs
          cargo test --locked -p surrealdb-kvs-tikv --test ops -- --ignored

      - name: Start the server on TiKV
        run: |
          nohup target/release/surreal-tikv start --user root --pass root --bind 127.0.0.1:8000 tikv://127.0.0.1:2379 > /tmp/surreal.log 2>&1 &
          for _ in $(seq 1 30); do
            if target/release/surreal-tikv is-ready --endpoint http://127.0.0.1:8000; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::the server did not become ready"
          cat /tmp/surreal.log
          exit 1

      - name: Write and read back a record
        run: |
          cat > /tmp/smoke.surql <<'SQL'
          CREATE person:tobie SET name = 'Tobie';
          SELECT VALUE name FROM person:tobie;
          SQL
          out=$(target/release/surreal-tikv sql --endpoint http://127.0.0.1:8000 --user root --pass root --ns test --db test --hide-welcome < /tmp/smoke.surql)
          echo "${out}"
          echo "${out}" | grep -q "Tobie"

      - name: Server log
        if: failure()
        run: cat /tmp/surreal.log

      - name: Stop the playground
        if: always()
        run: |
          "${HOME}/.tiup/bin/tiup" clean --all || true
          killall -q tiup-playground || true
